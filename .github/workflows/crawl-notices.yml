name: Crawl MJC Notices

on:
  schedule:
    # UTC 0시 = 한국시간(KST) 오전 9시
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run crawler
        run: npm run crawl:notices

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/notices.json
          if git diff --staged --quiet; then
            echo "No new notices."
          else
            git commit -m "chore: 명지전문대 공지사항 자동 업데이트"
            git push
          fi
